project:
  name: komet-desktop
  stereotype: DESKTOP
  versionPattern: CUSTOM
  description: Knowledge Management Environment Toolkit
  copyright: 2015-2026 Integrated Knowledge Management

platform:
  replacements:
    aarch_64: aarch64

assemble:
  jpackage:
    komet:
      active: ALWAYS
      exported: false
      verbose: false
      attachPlatform: true
      applicationPackage:
        appName: '${jpackage.app.name}'
        appVersion: '${jpackage.app.version}'
        vendor: IKM
      launcher:
        javaOptions:
          - --enable-preview
          - -Xmx42g
          - --add-opens javafx.graphics/javafx.scene=org.controlsfx.controls
          - --add-exports javafx.controls/com.sun.javafx.scene.control.behavior=dev.ikm.komet.navigator
          - --add-exports javafx.base/com.sun.javafx.event=one.jpro.platform.file
          - --add-modules jdk.incubator.vector
      java:
        mainModule: dev.ikm.komet.desktop
        mainClass: dev.ikm.komet.desktop.App
      runtimeImages:
        - path: ${project.build.directory}/jreleaser-jlink/assemble/komet-standard/jlink/${jreleaser.platform.work}/kometRuntimeImage-${jreleaser.platform.suffix}
          platform: ${jreleaser.platform}
      osx:
        types: [pkg]
        icon: ${project.basedir}/src/main/resources/icons/KOMET.icns
        resourceDir: ${project.basedir}/src/main/resources/installer/resourceDir_unix
        packageName: Komet Desktop
        sign: true
        signingKeyUsername: "Keith Eugene Campbell (8WUE5BZ4BP)"
        packageIdentifier: dev.ikm.komet.desktop
        packageSigningPrefix: dev.ikm.komet.
      linux:
        types: [rpm]
        icon: ${project.basedir}/src/main/resources/icons/Komet.png
        resourceDir: ${project.basedir}/src/main/resources/installer/resourceDir_unix
      windows:
        types: [msi]
        icon: ${project.basedir}/src/main/resources/icons/Komet.ico
        resourceDir: ${project.basedir}/src/main/resources/installer/resourceDir_win
        menu: true
